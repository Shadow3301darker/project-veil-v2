name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 5 hours of headroom; GitHub's hard cap is 6h per job

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          # llama.rn's postinstall must run to fetch native artifacts
          npm install-scripts approve llama.rn || true
          node node_modules/llama.rn/install/download-native-artifacts.js

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --clean
        env:
          # Only build for arm64 — matches target hardware, keeps compile time down
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Decode debug keystore (if provided) or use Gradle default debug signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
